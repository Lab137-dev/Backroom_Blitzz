<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<script>
'use strict';

/* ========= Overlay ========= */
function showOverlay(title, msg, autoMs, after){
  const ov=document.getElementById('overlay'), t=document.getElementById('overlayTitle'), m=document.getElementById('overlayMsg');
  if(!ov||!t||!m) return; t.textContent=title||'Notice'; m.textContent=msg||''; ov.style.display='flex';
  if(autoMs&&autoMs>0){ setTimeout(()=>{ ov.style.display='none'; if(after) after(); }, autoMs); }
}

/* ========= SFX ========= */
let SFX_ENABLED=true; let _audioCtx=null;
function sfxInit(){ try{ if(!_audioCtx) _audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function sfx(name){ if(!SFX_ENABLED) return; if(!_audioCtx) sfxInit(); if(!_audioCtx) return;
  const ctx=_audioCtx, o=ctx.createOscillator(), g=ctx.createGain(); let f=440,d=.08,type='sine';
  switch(name){
    case'box':f=740;d=.05;type='square';break;
    case'trash':f=220;d=.12;type='sawtooth';break;
    case'compact':f=120;d=.25;type='triangle';break;
    case'callaway':f=550;d=.15;type='sine';break;
    case'pizza':f=660;d=.18;type='square';break;
    case'palletDone':f=520;d=.12;type='triangle';break;
    case'corpCut':f=160;d=.45;type='sawtooth';break;
    case'select':f=880;d=.1;type='sine';break;
    default:break;
  }
  o.type=type; o.frequency.value=f; g.gain.value=0.0001; o.connect(g); g.connect(ctx.destination);
  const now=ctx.currentTime; o.start(now); g.gain.exponentialRampToValueAtTime(0.2, now+0.01); g.gain.exponentialRampToValueAtTime(0.0001, now+d); o.stop(now+d+0.01);
}

/* ========= Error surfacing ========= */
window.onerror=function(msg,src,line,col,err){
  try{ const text=(msg||'Error')+' @ '+(line||'?')+':'+(col||'?'); const t=document.getElementById('ticker');
    if(t) t.textContent='⚠️ '+text; showOverlay('Script Error', String(text), 2400);
  }catch(e){}
};

/* ========= UTIL ========= */
function reportError(where, err){
  const m=(err&&err.message)?err.message:String(err); const line=where+': '+m;
  console.error(line,err); const t=document.getElementById('ticker');
  if(t) t.textContent='⚠️ '+line;
}
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function fmtTime(minutes){
  const total=8*60+minutes; let h=Math.floor(total/60), m=total%60;
  const ampm=h>=12?'PM':'AM'; if(h>12) h-=12;
  return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

/* ========= CONSTANTS ========= */
const INGAME_MINUTE_MS=600;
const WORLD={w:1600,h:900};
const DOORS={
  pallet:{x:WORLD.w-120,y:120,w:100,h:60,label:'Pallet Door'},
  crew:{x:220,y:WORLD.h-110,w:110,h:70,label:'Crew Door'},
  comp:{x:WORLD.w-160,y:WORLD.h-120,w:120,h:70,label:'Compacter'}
};
const COLORS={
  bg:'#1a2036', pallet:'#8b5e3c', worker:'#4aa3ff', workerSel:'#7ec8ff',
  trash:'#c34848', door:'#f2994a', bin:'#4ad07b', shelf:'#e2c84f',
  rack:'#a86ee8', comp:'#222', text:'#e8ecff', outline:'rgba(255,255,255,.18)',
  activePalletGlow:'rgba(125,220,131,0.4)'
};
const VARIANTS=[
  {name:'Balanced Day',weights:{home:1,decor:1,cloth:1}},
  {name:'Decor Day',weights:{home:.6,decor:2.2,cloth:.8}},
  {name:'Clothing Day',weights:{home:.7,decor:.8,cloth:2}},
  {name:'Home Goods Day',weights:{home:2,decor:.8,cloth:.8}}
];
function pickWeighted(w){
  const e=Object.entries(w); const s=e.reduce((a,[,x])=>a+x,0);
  let r=Math.random()*s; for(const [k,x] of e){ if((r-=x)<=0) return k; }
  return e[0][0];
}

/* ========= ENTITIES ========= */
const NAME_ORDER=["Alex","Riley-L","Danny","Dale","Carrissa","April","Rando-1","Rando-2"];
let bannedNames=new Set();
function makeWorker(i){
  const baseSpeed=3.8*1.2*2*2*2*2*1.25*2;
  const baseSprint=6.0*1.2*2*2*2*2*1.25*2;
  const name=NAME_ORDER[i]||`W${i+1}`;
  const isFav=(name==='Alex'||name==='Danny');
  const speed=baseSpeed*(isFav?1.05:1), sprint=baseSprint*(isFav?1.05:1);
  return {
    id:i, x:DOORS.crew.x+40+(i%3)*32, y:DOORS.crew.y-40-(Math.floor(i/3)*32),
    r:Math.round(14*1.25), speed, sprint, selected:false, task:null, busy:false,
    visible:false, status:'off', nextStatusChange:0, name, callaways:0, fatigue:0,
    pulse:0 // For selection animation
  };
}
function newContainer(kind){
  const cfg={home:{min:5,max:10},decor:{min:10,max:15},cloth:{min:15,max:20}}[kind];
  const cap=rand(cfg.min,cfg.max);
  return {centered:true,kind,capacity:cap,fill:0,x:0,y:0,w:60,h:60,id:Math.random()};
}
function makePallet(x,y){
  const n=rand(20,50); const types=Array.from({length:n},()=>pickWeighted(dayVariant.weights));
  return {id:Math.random(),x,y,w:70,h:70,boxes:n,initialBoxes:n,types,active:true};
}

/* ========= STATE ========= */
const state={
  running:false, paused:false, level:1, minute:0,
  crew:[], selectedWorker:null,
  bins:[], shelves:[], racks:[],
  trashCans:[
    {centered:true,fill:0,cap:25,x:140,y:90,w:40,h:40,id:Math.random()},
    {centered:true,fill:0,cap:25,x:200,y:90,w:40,h:40,id:Math.random()}
  ],
  compacter:{count:0,cap:4,x:DOORS.comp.x+DOORS.comp.w/2,y:DOORS.comp.y-20,w:70,h:40},
  palletsActive:[], palletsQueue:0, palletsMaxOnFloor:3,
  boxesDone:0, stress:0, log:[], sickCount:0,
  pizza:{lastDay:-999,active:false,pct:0,startMinute:0,endMinute:0}
};
function log(msg){
  state.log.unshift(`[${fmtTime(state.minute)}] ${msg}`);
  state.log=state.log.slice(0,80);
  document.getElementById('log').innerHTML=state.log.map(l=>`<div>${l}</div>`).join('');
  const t=document.getElementById('ticker'); if(t) t.textContent=msg;
}

/* ========= LAYOUT & VARIANTS ========= */
let dayVariant=VARIANTS[0];
const EXCUSES=[
  "Corporate has decided {NAME} is better utilized as a parking lot traffic cone.",
  "{NAME} has been promoted to ‘Cart Wrangler Emeritus’.",
  "Due to budget realignment, {NAME} is now working as a shelf.",
  "{NAME} has been reassigned to test the comfort of breakroom chairs full‑time.",
  "{NAME} is now our official Doorstop Technician.",
  "{NAME} has been moved into our Shadowy Corporate Think Tank.",
  "We are rotating {NAME} into a new department called ‘Somewhere Else’.",
  "{NAME} has been transferred to an exciting role: Not Here.",
  "Corporate eliminated this role to make room for more motivational posters.",
  "{NAME} has gone to a better place… the better store across town."
];
let daysSinceCut=0; let removedRoster=new Set();
function chooseVariant(){
  dayVariant=VARIANTS[rand(0,VARIANTS.length-1)];
  log(`Variant today: ${dayVariant.name}.`);
}
function layoutContainers(){
  const col1x=150,col2x=300,gapY=90,startY=220;
  state.shelves=[newContainer('decor'),newContainer('decor'),newContainer('decor')];
  state.bins=[newContainer('home'),newContainer('home'),newContainer('home')];
  state.racks=[newContainer('cloth'),newContainer('cloth'),newContainer('cloth')];
  state.shelves.forEach((c,i)=>{c.x=col1x;c.y=startY+i*gapY;});
  const b=startY+3*gapY+20;
  state.bins.forEach((c,i)=>{c.x=col1x;c.y=b+i*gapY;});
  const r=startY+gapY/2;
  state.racks.forEach((c,i)=>{c.x=col2x;c.y=r+i*gapY;});
}

/* ========= CREW & TEMPS ========= */
function scheduleCrew(){
  state.crew=[];
  const baseNames=NAME_ORDER.filter(n=>!bannedNames.has(n)&&!n.startsWith('Rando'));
  const baseCount=Math.min(6,baseNames.length);
  const count=Math.max(2,baseCount);
  let sick=0;
  for(let i=0;i<count;i++){
    const w=makeWorker(i); w.name=baseNames[i]||w.name;
    if(Math.random()<0.12){ w.status='sick'; w.visible=false; sick++; log(`${w.name} called out sick.`); }
    else{
      const r=Math.random(); let late=0;
      if(r<0.7) late=rand(0,5); else if(r<0.95) late=rand(5,15); else late=rand(15,30);
      w.arrival=late; if(late>0) log(`${w.name} is late (~${late} min).`);
    }
    w.mBreak=rand(120,180); w.mBreakDur=15; w.lunch=rand(240,300); w.lunchDur=45;
    w.aBreak=rand(360,465); w.aBreakDur=15;
    state.crew.push(w);
  }
  state.sickCount=sick;
  ['Rando-1','Rando-2'].filter(n=>!bannedNames.has(n)).forEach((n,idx)=>{
    if(Math.random()<0.6){
      const t=makeWorker(count+idx); t.name=n; t.visible=false; t.status='off';
      t.arrival=rand(60,150); t.leaveAt=t.arrival+rand(90,180);
      t.mBreak=9999; t.lunch=9999; t.aBreak=9999;
      state.crew.push(t); log(`${n} might pop in to help today.`);
    }
  });
}
function schedulePizza(){
  const can=(state.level-state.pizza.lastDay)>=7;
  if(!can){ state.pizza.active=false; return; }
  if(Math.random()<0.3){
    const pct=rand(5,15), start=rand(150,300);
    state.pizza={lastDay:state.level,active:false,pct,startMinute:start,endMinute:start+120};
    log(`Alex convinced Ernie to buy pizza today. (+${pct}% speed for 2h, starts ${fmtTime(start)})`);
  } else state.pizza.active=false;
}
function setupDay(carryOver=false){
  const leftover=carryOver?state.palletsActive.filter(p=>p.active&&p.boxes>0):[];
  leftover.forEach(p=>{ if(!('initialBoxes' in p)) p.initialBoxes=p.boxes; });
  state.minute=0; chooseVariant(); schedulePizza();
  state.palletsQueue=rand(6,11);
  if(Math.random()<0.15) state.palletsQueue+=rand(1,2); // Bonus pallets
  state.palletsActive=leftover; state.boxesDone=0; state.stress=8; // Lower initial stress
  state.compacter.count=0; state.trashCans.forEach(t=>t.fill=0);
  layoutContainers(); scheduleCrew(); state.selectedWorker=null;
  log(`Day ${state.level} starts. New pallets: ${state.palletsQueue}. Carryover pallets: ${leftover.length}.`);
}

/* ========= LOOP ========= */
let canvasEl, ctx2, lastTick=0, acc=0;
function startGame(){
  removedRoster=new Set(); bannedNames=new Set(); daysSinceCut=0;
  state.running=true; state.paused=false; state.level=1;
  setupDay(false); updateHUD();
  const t=document.getElementById('ticker'); if(t) t.textContent='New game started.';
}
function nextDay(){
  state.level++; setupDay(true); updateHUD();
}
function updateHUD(){
  document.getElementById('day').textContent=state.level;
  document.getElementById('time').textContent=fmtTime(state.minute);
  const crewActive=state.crew.filter(w=>w.status!=='sick').length;
  document.getElementById('crew').textContent=`${crewActive - state.crew.filter(w=>!w.visible).length}/${crewActive}`;
  document.getElementById('pallets').textContent=`${state.palletsActive.length}/${state.palletsQueue+state.palletsActive.length}`;
  document.getElementById('done').textContent=state.boxesDone;
  document.getElementById('stress').textContent=`${Math.round(state.stress)}%`;
  const total=a=>a.reduce((x,b)=>x+b.capacity,0), fill=a=>a.reduce((x,b)=>x+b.fill,0);
  document.getElementById('binBar').style.width=`${100*fill(state.bins)/Math.max(1,total(state.bins))}%`;
  document.getElementById('shelfBar').style.width=`${100*fill(state.shelves)/Math.max(1,total(state.shelves))}%`;
  document.getElementById('rackBar').style.width=`${100*fill(state.racks)/Math.max(1,total(state.racks))}%`;
  const fullCans=state.trashCans.filter(t=>t.fill>=t.cap).length;
  const tp=document.getElementById('trashPill');
  tp.textContent=`${fullCans} / ${state.trashCans.length} full`;
  tp.className='pill '+(fullCans===0?'ok':(fullCans<state.trashCans.length?'warn':'bad'));
  const cp=document.getElementById('compPill');
  cp.textContent=`${state.compacter.count} / ${state.compacter.cap}`;
  cp.className='pill '+(state.compacter.count<state.compacter.cap?'ok':'bad');
  const chip=document.getElementById('pizzaChip');
  if(state.pizza&&state.pizza.active){
    chip.style.display=''; document.getElementById('pizzaPct').textContent=`${state.pizza.pct}%`;
    document.getElementById('pizzaTime').textContent=`${Math.max(0,state.pizza.endMinute-state.minute)}`;
  } else chip.style.display='none';
}
function tick(dt){
  if(!state.running||state.paused) return;
  acc+=dt; while(acc>=INGAME_MINUTE_MS){
    acc-=INGAME_MINUTE_MS; try{ simMinute(); }catch(e){ reportError('simMinute',e); }
  }
  try{ draw(); }catch(e){ reportError('draw',e); }
  // Update pulse animation
  state.crew.forEach(w=>{
    if(w.selected||w.task) w.pulse=Math.min(w.pulse+0.05,1);
    else w.pulse=Math.max(w.pulse-0.05,0);
  });
}
function applySpeedBonus(s,w){
  let factor=1;
  if(state.pizza&&state.pizza.active) factor*=1+state.pizza.pct/100;
  factor*=(1-Math.min(w.fatigue/100,0.3)); // Fatigue reduces speed up to 30%
  return s*factor;
}
function startBreak(w,dur,label){
  w.status='break'; w.task={kind:'exitDoor',tx:DOORS.crew.x+DOORS.crew.w/2,ty:DOORS.crew.y+DOORS.crew.h/2};
  w.nextStatusChange=state.minute+dur; log(`${w.name} on ${label.toLowerCase()} (${dur} min).`);
}
function startAssist(w,dur,label){
  w.status='assist'; w.task={kind:'exitDoor',tx:DOORS.crew.x+DOORS.crew.w/2,ty:DOORS.crew.y+DOORS.crew.h/2};
  w.nextStatusChange=state.minute+dur; log(`${w.name} called to ${label.toLowerCase()} (${dur} min).`);
}
function startRest(w){
  if(w.status!=='work'||!w.visible){ log(`${w.name} cannot rest now (${w.status}).`); return; }
  w.status='rest'; w.task=null; w.nextStatusChange=state.minute+30; w.busy=true;
  log(`${w.name} resting (30 min). Fatigue will decrease.`);
}
function maybeBackFromBreak(w){
  if((w.status==='break'||w.status==='assist'||w.status==='rest')&&state.minute>=w.nextStatusChange){
    w.visible=true; w.task={kind:'enterDoor',tx:DOORS.crew.x+DOORS.crew.w+40,ty:DOORS.crew.y-40};
    w.status='work'; w.fatigue=Math.max(0,w.fatigue-30); // Reduce fatigue
    log(`${w.name} returned${w.status==='rest'?'. Fatigue reduced.':'.'}`);
    setTimeout(()=>{ if(!w.task) assignShuttle(w); },150);
  }
}
function moveTowards(w,tx,ty,sprint=false){
  const dx=tx-w.x, dy=ty-w.y; let dist=Math.hypot(dx,dy);
  if(!isFinite(dist)||dist===0){ w.x=tx; w.y=ty; return true; }
  const base=sprint?w.sprint:w.speed; let sp=applySpeedBonus(base,w);
  if(!isFinite(sp)||sp<=0) sp=1;
  if(dist>sp){ w.x+=(dx/dist)*sp; w.y+=(dy/dist)*sp; return false; }
  w.x=tx; w.y=ty; return true;
}
function simMinute(){
  state.minute++;
  if(state.pizza && !state.pizza.active && state.minute===state.pizza.startMinute){
    state.pizza.active=true; log(`🍕 Pizza arrived! +${state.pizza.pct}% speed for 2 hours.`); sfx('pizza');
  }
  if(state.pizza && state.pizza.active && state.minute>=state.pizza.endMinute){
    state.pizza.active=false; log(`🍕 Pizza boost ended.`);
  }
  if(state.minute>=480){
    const win=(state.palletsActive.length===0 && state.palletsQueue===0);
    if(win){
      daysSinceCut++; const cutToday=(daysSinceCut>=(Math.random()<0.5?2:3));
      if(cutToday){
        daysSinceCut=0; const victim=pickCorpCut();
        if(victim){
          const excuse=EXCUSES[Math.floor(Math.random()*EXCUSES.length)].replace('{NAME}',victim);
          log('Corporate removed '+victim+'.'); sfx('corpCut');
          showOverlay('Corporate Communication', excuse, 2200, ()=>{ nextDay(); state.running=true; });
        } else {
          log('Day complete! No staff changes today.');
          showOverlay('Day Complete','No staff changes today. Starting next day…',1600,()=>{ nextDay(); state.running=true; });
        }
      } else {
        log('Day complete! No staff changes today.');
        showOverlay('Day Complete','No staff changes today. Starting next day…',1600,()=>{ nextDay(); state.running=true; });
      }
    } else {
      log('Shift ended with work unfinished. Carrying work to tomorrow…');
      showOverlay('Shift Ended','Unfinished pallets will carry over. Starting next day…',1600,()=>{ nextDay(); });
    }
    return;
  }
  // Fatigue accumulation
  state.crew.forEach(w=>{
    if(w.visible && w.status==='work' && w.task) w.fatigue=clamp(w.fatigue+0.2,0,100);
  });
  // Arrivals & temp departures
  state.crew.forEach(w=>{
    if(w.status==='sick') return;
    if(!w.visible && state.minute>=w.arrival){
      w.visible=true; w.status='work'; w.task={kind:'enterDoor',tx:DOORS.crew.x+DOORS.crew.w+40,ty:DOORS.crew.y-40};
      log(`${w.name} clocked in.`);
    }
    if(w.name&&w.name.startsWith('Rando')&&w.visible&&w.leaveAt&&state.minute>=w.leaveAt){
      w.status='assist'; w.task={kind:'exitDoor',tx:DOORS.crew.x+DOORS.crew.w/2,ty:DOORS.crew.y+DOORS.crew.h/2};
      w.nextStatusChange=state.minute; log(`${w.name} headed out. Thanks!`); bannedNames.add(w.name);
    }
  });
  // Breaks
  state.crew.forEach(w=>{
    if(!w.visible||w.status==='sick') return;
    if(w.status==='work'&&state.minute===w.mBreak) startBreak(w,w.mBreakDur,'Break');
    if(w.status==='work'&&state.minute===w.lunch) startBreak(w,w.lunchDur,'Lunch');
    if(w.status==='work'&&state.minute===w.aBreak) startBreak(w,w.aBreakDur,'Break');
  });
  // Call-aways
  state.crew.forEach(w=>{
    if(!w.visible||w.status!=='work') return;
    if(w.name==='Alex'||w.name==='Danny'||(w.name&&w.name.startsWith('Rando'))) return;
    if(w.callaways>=3) return;
    if(Math.random()<0.002){ startAssist(w,rand(10,30),'Assist at cash'); sfx('callaway'); w.callaways++; }
    else if(Math.random()<0.0015){ startAssist(w,15,'Cover front-end'); sfx('callaway'); w.callaways++; }
  });
  state.crew.forEach(w=>{ if(w.visible && w.task) stepTask(w); });
  const fullCans=state.trashCans.filter(t=>t.fill>=t.cap).length;
  if(fullCans===1) state.stress+=0.2; // Reduced stress impact
  if(fullCans>=2) state.stress+=0.6; // Reduced stress impact
  if(state.compacter.count>=state.compacter.cap) state.stress+=0.6; // Reduced stress impact
  const outstanding=state.palletsActive.reduce((a,p)=>a+p.boxes,0);
  if(outstanding>80) state.stress+=0.2; // Reduced stress impact
  if(outstanding>150) state.stress+=0.4; // Reduced stress impact
  state.stress=clamp(state.stress-0.3,0,100); // Slightly faster stress decay
  if(state.stress>=100){
    log('Burnout! Stress maxed out.');
    showOverlay('Burnout','Stress maxed out. Starting next day…',1600,()=>{ nextDay(); });
  }
  updateHUD();
}
function pickCorpCut(){
  const order=['Rando-1','Rando-2','April','Carrissa','Dale','Riley-L','Danny','Alex'];
  const names=state.crew.map(w=>w.name).filter((v,i,a)=>a.indexOf(v)===i);
  for(const n of order){
    if(names.includes(n)&&!removedRoster.has(n)){ removedRoster.add(n); bannedNames.add(n); return n; }
  }
  return null;
}

/* ========= TASKS ========= */
function assignShuttle(w){
  const p=state.palletsActive.find(pp=>pp.active&&pp.boxes>0);
  if(p){
    w.task={kind:'workPallet',pallet:p,tx:p.x+p.w/2,ty:p.y+p.h/2,stage:0};
    w.busy=true; log(`${w.name} assigned to pallet.`);
    return;
  }
  if(state.palletsQueue>0 && state.palletsActive.length<state.palletsMaxOnFloor){
    const spot=nonOverlappingSpawn(); if(!spot){ log('No space to place another pallet.'); return; }
    const np=makePallet(spot.x,spot.y); state.palletsActive.push(np); state.palletsQueue--;
    w.task={kind:'bringPallet',tx:np.x+np.w/2,ty:np.y+np.h/2}; w.busy=true;
    log(`${w.name} brought out a pallet.`);
    return;
  }
}
function stepTask(w){
  const t=w.task; if(!t) return;
  if(t.kind==='enterDoor'){ if(moveTowards(w,t.tx,t.ty,true)){ w.task=null; w.busy=false; } return; }
  if(t.kind==='exitDoor'){ if(moveTowards(w,t.tx,t.ty,true)){ w.visible=false; w.task=null; w.busy=false; } return; }
  if(t.kind==='bringPallet'){ if(moveTowards(w,t.tx,t.ty)){ assignShuttle(w); } return; }
  if(t.kind==='workPallet'){ shuttleBox(w); return; }
  if(t.kind==='emptyTrash'){
    if(!t.stage) t.stage=0;
    if(t.stage===0){
      if(moveTowards(w,t.tx,t.ty)){
        t.stage=1; t.tx=DOORS.comp.x+DOORS.comp.w/2; t.ty=DOORS.comp.y+DOORS.comp.h/2;
        log(`${w.name} hauling trash to compacter.`);
      }
    } else if(t.stage===1){
      if(moveTowards(w,t.tx,t.ty)){
        state.compacter.count=clamp(state.compacter.count+1,0,state.compacter.cap);
        t.can.fill=0; w.task=null; w.busy=false; log(`${w.name} emptied trash can.`); sfx('trash');
      }
    }
    return;
  }
  if(t.kind==='compact'){
    if(moveTowards(w,t.tx,t.ty)){
      state.compacter.count=0; w.task=null; w.busy=false; log(`${w.name} compacted trash.`); sfx('compact');
    }
    return;
  }
  if(t.kind==='swapContainer'){
    if(moveTowards(w,t.tx,t.ty)){
      t.container.fill=0; w.task=null; w.busy=false; log(`${w.name} swapped a full ${t.container.kind} container.`);
    }
    return;
  }
}
function shuttleBox(w){
  try{
    const t=w.task; if(!t){ w.busy=false; return; }
    const p=t.pallet; if(!p||!p.active||p.boxes<=0){ w.task=null; w.busy=false; return; }
    if(!Array.isArray(p.types)||p.types.length===0){
      log('⚠️ Pallet data missing'); w.task=null; w.busy=false; return;
    }
    const type=p.types[Math.max(0,Math.min(p.boxes-1,p.types.length-1))];
    const arr=(type==='home')?state.bins:(type==='decor')?state.shelves:state.racks;
    if(!arr||arr.length===0){
      log('⚠️ No containers available'); w.task=null; w.busy=false; return;
    }
    let target=arr.find(c=>c&&(c.fill<c.capacity));
    if(!target){
      w.task=null; w.busy=false; log(`All ${type} containers are full! Swap one.`); state.stress+=2; return;
    }
    if(!t.stage){
      if(moveTowards(w,t.tx,t.ty)){
        t.stage=1; t.tx=target.x; t.ty=target.y; t.targetContainer=target;
      }
    } else if(t.stage===1){
      if(moveTowards(w,t.tx,t.ty)){
        if(!t.targetContainer){ log('⚠️ Lost target container'); w.task=null; w.busy=false; return; }
        if(t.targetContainer.fill>=t.targetContainer.capacity){
          log(`Target ${t.targetContainer.kind} container became full. ${w.name} needs a swap.`);
          w.task=null; w.busy=false; return;
        }
        p.boxes--; t.targetContainer.fill++; state.boxesDone++;
        let least=state.trashCans.reduce((a,b)=>a.fill<=b.fill?a:b);
        if(least) least.fill=clamp(least.fill+2,0,least.cap); sfx('box');
        log(`${w.name} stocked 1 box to ${t.targetContainer.kind}.`);
        if(p.boxes<=0){
          p.active=false; state.palletsActive=state.palletsActive.filter(pp=>pp.active);
          log(`Pallet finished.`); sfx('palletDone'); w.task=null; w.busy=false; assignShuttle(w);
          return;
        }
        t.stage=0; t.tx=p.x+p.w/2; t.ty=p.y+p.h/2;
      }
    }
  }catch(e){ reportError('shuttleBox',e); w.task=null; w.busy=false; }
}

/* ========= COORDS & DRAW ========= */
function containsRect(r,x,y){
  const rx=r.centered?(r.x-r.w/2):r.x, ry=r.centered?(r.y-r.h/2):r.y;
  return (x>=rx&&x<=rx+r.w&&y>=ry&&y<=ry+r.h);
}
function rectsOverlap(a,b){
  const ax=a.centered?(a.x-a.w/2):a.x, ay=a.centered?(a.y-a.h/2):a.y;
  const bx=b.centered?(b.x-b.w/2):b.x, by=b.centered?(b.y-b.h/2):b.y;
  return !(ax+a.w<=bx||bx+b.w<=ax||ay+a.h<=by||by+b.h<=ay);
}
function nonOverlappingSpawn(){
  const spots=[];
  for(let i=0;i<4;i++){ for(let j=0;j<3;j++){ spots.push({x:WORLD.w-350-i*90,y:140+j*110,w:70,h:70}); } }
  for(const s of spots){ if(!state.palletsActive.some(p=>rectsOverlap(s,p))) return {x:s.x,y:s.y}; }
  for(let k=0;k<20;k++){
    const px=WORLD.w-260-rand(0,120), py=200+rand(-40,220), r={x:px,y:py,w:70,h:70};
    if(!state.palletsActive.some(p=>rectsOverlap(r,p))) return {x:px,y:py};
  }
  return null;
}
function pickWorkerAt(x,y){
  const w=state.crew.find(w=>w.visible&&Math.hypot(w.x-x,w.y-y)<=w.r);
  if(!w) return;
  if(w.status!=='work'){ log(`${w.name} is not available (${w.status}).`); return; }
  state.crew.forEach(ww=>ww.selected=false); w.selected=true; state.selectedWorker=w;
  sfx('select'); // Play selection sound
}
function commandSelectedToTargetAt(x,y){
  const w=state.selectedWorker; if(!w||w.status!=='work') return;
  if(x>=DOORS.pallet.x&&x<=DOORS.pallet.x+DOORS.pallet.w&&y>=DOORS.pallet.y&&y<=DOORS.pallet.y+DOORS.pallet.h){
    if(state.palletsActive.length>=state.palletsMaxOnFloor){ log('Max pallets on floor (3).'); return; }
    if(state.palletsQueue<=0){ log('No more pallets to bring.'); return; }
    const spot=nonOverlappingSpawn(); if(!spot){ log('No space to place another pallet.'); return; }
    const p=makePallet(spot.x,spot.y); state.palletsActive.push(p); state.palletsQueue--;
    w.task={kind:'bringPallet',tx:p.x+p.w/2,ty:p.y+p.h/2}; w.busy=true;
    log(`${w.name} brought out a pallet.`);
    return;
  }
  if(x>=DOORS.comp.x&&x<=DOORS.comp.x+DOORS.comp.w&&y>=DOORS.comp.y&&y<=DOORS.comp.y+DOORS.comp.h){
    if(state.compacter.count>=state.compacter.cap){
      w.task={kind:'compact',tx:DOORS.comp.x+DOORS.comp.w/2,ty:DOORS.comp.y+DOORS.comp.h/2};
      w.busy=true; log(`${w.name} heading to compact.`);
    } else { log('Compacter not full enough to run (fills to 4).'); }
    return;
  }
  const p=state.palletsActive.find(pp=>containsRect(pp,x,y));
  if(p){
    if(!p.active||p.boxes<=0){ log('That pallet is empty.'); return; }
    w.task={kind:'workPallet',pallet:p,tx:p.x+p.w/2,ty:p.y+p.h/2,stage:0};
    w.busy=true; log(`${w.name} assigned to pallet.`);
    return;
  }
  const t=state.trashCans.find(t=>containsRect(t,x,y));
  if(t){
    if(t.fill>=t.cap){
      w.task={kind:'emptyTrash',tx:t.x,ty:t.y,can:t,stage:0}; w.busy=true; log(`${w.name} emptying trash.`);
    } else { log('Trash can not full yet.'); }
    return;
  }
  const findC=a=>a.find(c=>containsRect(c,x,y));
  const c=findC(state.bins)||findC(state.shelves)||findC(state.racks);
  if(c){
    if(c.fill>=c.capacity){
      w.task={kind:'swapContainer',container:c,tx:c.x,ty:c.y}; w.busy=true;
      log(`${w.name} swapping full ${c.kind} container.`);
    } else { log('Container has space; no action needed.'); }
    return;
  }
  log('No actionable target.');
}
let ctx;
function drawDoor(d){
  ctx.fillStyle=COLORS.door; ctx.fillRect(d.x,d.y,d.w,d.h);
  ctx.strokeStyle=COLORS.outline; ctx.strokeRect(d.x,d.y,d.w,d.h);
  ctx.fillStyle=COLORS.text; ctx.font='20px sans-serif'; ctx.fillText(d.label, d.x-10, d.y-8);
}
function drawPalletProgress(p){
  const total=p.initialBoxes||p.boxes||1, done=total-p.boxes, pct=done/Math.max(1,total);
  const bx=p.x, by=p.y-18, bw=p.w, bh=10;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#7ddc83'; ctx.fillRect(bx,by,bw*pct,bh);
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.fillText(`${done}/${total}`, bx+2, by-2);
}
function drawStatusBadge(w){
  let ring='rgba(255,255,255,.35)', badgeText='', badgeColor='#2b2f45';
  if(w.status==='break'){ring='#f6b73c'; badgeText='BREAK'; badgeColor='rgba(246,183,60,.9)';}
  else if(w.status==='assist'){ring='#ee5a5a'; badgeText='AWAY'; badgeColor='rgba(238,90,90,.9)';}
  else if(w.status==='work'){ ring='#7ddc83'; }
  else if(w.status==='rest'){ ring='#4ad07b'; badgeText='REST'; badgeColor='rgba(74,208,123,.9)';}
  ctx.beginPath(); ctx.strokeStyle=ring; ctx.lineWidth=4; ctx.arc(w.x,w.y,w.r+4,0,Math.PI*2); ctx.stroke();
  if(badgeText){
    ctx.fillStyle=badgeColor; const pad=4; ctx.font='bold 14px sans-serif';
    const tw=ctx.measureText(badgeText).width; const bw=tw+pad*2, by=22;
    const bx=w.x-bw/2, byPos=w.y-w.r-24; ctx.fillRect(bx,byPos,bw,by);
    ctx.fillStyle='#111'; ctx.fillText(badgeText,bx+pad,byPos+16);
  }
}
function draw(){
  const cw=canvasEl.clientWidth, ch=canvasEl.clientHeight;
  if(canvasEl.width!==cw||canvasEl.height!==ch){ canvasEl.width=cw; canvasEl.height=ch; }
  ctx.clearRect(0,0,cw,ch); ctx.save();
  const sx=cw/WORLD.w, sy=ch/WORLD.h, s=Math.min(sx,sy), ox=(cw-WORLD.w*s)/2, oy=(ch-WORLD.h*s)/2;
  ctx.translate(ox,oy); ctx.scale(s,s);
  ctx.fillStyle=COLORS.bg; ctx.fillRect(0,0,WORLD.w,WORLD.h);
  ctx.strokeStyle=COLORS.outline; ctx.lineWidth=2; ctx.strokeRect(0,0,WORLD.w,WORLD.h);
  drawDoor(DOORS.pallet); drawDoor(DOORS.crew);
  ctx.fillStyle=COLORS.comp; ctx.fillRect(DOORS.comp.x,DOORS.comp.y,DOORS.comp.w,DOORS.comp.h);
  ctx.strokeStyle=COLORS.outline; ctx.strokeRect(DOORS.comp.x,DOORS.comp.y,DOORS.comp.w,DOORS.comp.h);
  ctx.fillStyle=COLORS.text; ctx.font='20px sans-serif'; ctx.fillText('Compacter', DOORS.comp.x-10, DOORS.comp.y-8);
  function drawContainers(arr,color,tag){
    arr.forEach(c=>{
      ctx.fillStyle=color; ctx.fillRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);
      ctx.strokeStyle=COLORS.outline; ctx.strokeRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);
      const pct=c.fill/Math.max(1,c.capacity);
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(c.x-c.w/2,c.y+c.h/2-10,c.w,10);
      ctx.fillStyle='#8de0a2'; ctx.fillRect(c.x-c.w/2,c.y+c.h/2-10,c.w*pct,10);
      ctx.fillStyle=COLORS.text; ctx.font='12px sans-serif'; ctx.fillText(tag,c.x-c.w/2+2,c.y-c.h/2-8);
    });
  }
  drawContainers(state.bins, COLORS.bin, 'BINS (Home)');
  drawContainers(state.shelves, COLORS.shelf, 'SHELVES (Decor)');
  drawContainers(state.racks, COLORS.rack, 'RACKS (Clothing)');
  state.trashCans.forEach(t=>{
    ctx.fillStyle=COLORS.trash; ctx.fillRect(t.x-t.w/2,t.y-t.h/2,t.w,t.h);
    ctx.strokeStyle=COLORS.outline; ctx.strokeRect(t.x-t.w/2,t.y-t.h/2,t.w,t.h);
    const pct=t.fill/t.cap; ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(t.x-t.w/2,t.y+t.h/2-10,t.w,10);
    ctx.fillStyle='#f6b73c'; ctx.fillRect(t.x-t.w/2,t.y+t.h/2-10,t.w*pct,10);
    ctx.fillStyle=COLORS.text; ctx.font='12px sans-serif'; ctx.fillText('TRASH', t.x-18, t.y-t.h/2-8);
  });
  state.palletsActive.forEach(p=>{
    ctx.fillStyle=COLORS.pallet; ctx.fillRect(p.x,p.y,p.w,p.h);
    if(p.active&&p.boxes>0){
      ctx.strokeStyle=COLORS.activePalletGlow; ctx.lineWidth=4; ctx.strokeRect(p.x-2,p.y-2,p.w+4,p.h+4);
    }
    ctx.strokeStyle=COLORS.outline; ctx.strokeRect(p.x,p.y,p.w,p.h);
    drawPalletProgress(p);
    ctx.fillStyle=COLORS.text; ctx.font='16px sans-serif'; ctx.fillText(`${p.boxes}`, p.x+8, p.y+24);
  });
  state.crew.forEach(w=>{
    if(!w.visible) return;
    drawStatusBadge(w);
    ctx.beginPath();
    const scale=1+w.pulse*0.1; // Pulse effect
    ctx.save(); ctx.translate(w.x,w.y); ctx.scale(scale,scale);
    ctx.fillStyle=w.selected?COLORS.workerSel:COLORS.worker;
    ctx.arc(0,0,w.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=COLORS.outline; ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.fillText(w.name, w.x-22, w.y+w.r+14);
  });
  ctx.restore();
}
function clientToWorld(cx,cy){
  const cw=canvasEl.clientWidth,ch=canvasEl.clientHeight;
  const sx=cw/WORLD.w, sy=ch/WORLD.h, s=Math.min(sx,sy), ox=(cw-WORLD.w*s)/2, oy=(ch-WORLD.h*s)/2;
  return {x:(cx-ox)/s,y:(cy-oy)/s};
}
function showTooltip(w,cx,cy){

/* ========= MAIN ========= */
let __started=false;
function ensureStart(reason){
  if(__started) return; __started=true;
  try{
    startGame();
    const t=document.getElementById('ticker'); if(t) t.textContent='Starting ('+reason+')…';
  }catch(e){
    const t=document.getElementById('ticker');
    if(t) t.textContent='⚠️ start error: '+(e&&e.message?e.message:String(e));
    showOverlay('Start Error', (e&&e.message?e.message:String(e)), 2200);
  }
}
function setupCanvas(){
  canvasEl=document.getElementById('game'); ctx=canvasEl.getContext('2d');
  const wrap=document.getElementById('canvaswrap');
  const resize=()=>{
    const r=wrap.getBoundingClientRect();
    canvasEl.style.width=r.width+'px';
    canvasEl.style.height=Math.max(320,(window.innerHeight-r.top-90))+'px';
  };
  window.addEventListener('resize',resize); resize();
  const onPointer=(e)=>{
    e.preventDefault();
    const rect=canvasEl.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    const {x,y}=clientToWorld(cx,cy);
    const clicked=state.crew.find(w=>w.visible&&Math.hypot(w.x-x,w.y-y)<=w.r);
    if(clicked) pickWorkerAt(x,y);
    else commandSelectedToTargetAt(x,y);
  };
  const onMove=(e)=>{
    const rect=canvasEl.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    const {x,y}=clientToWorld(cx,cy);
    const w=state.crew.find(w=>w.visible&&Math.hypot(w.x-x,w.y-y)<=w.r);
    showTooltip(w,cx,cy);
  };
  canvasEl.addEventListener('mousedown',onPointer);
  canvasEl.addEventListener('touchstart',onPointer,{passive:false});
  canvasEl.addEventListener('mousemove',onMove);
  canvasEl.addEventListener('touchmove',onMove,{passive:false});
  canvasEl.addEventListener('mouseleave',()=>{ showTooltip(null,0,0); });
}
function gameLoop(ts){
  if(!lastTick) lastTick=ts; const dt=ts-lastTick; lastTick=ts;
  if(!state.paused) tick(dt);
  requestAnimationFrame(gameLoop);
}
function initApp(){
  try{
    setupCanvas();
    requestAnimationFrame(gameLoop);
    const btnStart=document.getElementById('btnStart');
    const btnAssign=document.getElementById('btnAssign');
    const btnHelp=document.getElementById('btnHelp');
    const btnPause=document.getElementById('btnPause');
    const btnSfx=document.getElementById('btnSfx');
    const btnForce=document.getElementById('btnForce');
    const btnRest=document.getElementById('btnRest');
    if(btnStart){ btnStart.addEventListener('click', ()=>ensureStart('button')); }
    if(btnAssign){
      btnAssign.addEventListener('click', ()=>{
        state.crew.forEach(w=>{
          if(!w.visible||w.status!=='work') return;
          if(w.task&&(w.task.kind==='workPallet'||w.task.kind==='bringPallet')) return;
          assignShuttle(w);
        });
        log('Assigned all available workers to pallets.');
      });
    }
    if(btnHelp){
      btnHelp.addEventListener('click', ()=>{
        showOverlay('How to Play','Tap a worker, then tap a target. Pallet Door brings pallets (max 3). Tap a pallet to shuttle boxes. Empty full trash into compacter. Compact at 4. Swap full bins/shelves/racks. Rest workers to reduce fatigue.',1600);
      });
    }
    if(btnPause){
      btnPause.addEventListener('click', (e)=>{
        state.paused=!state.paused; e.target.textContent=state.paused?'Resume':'Pause';
      });
    }
    if(btnSfx){
      btnSfx.addEventListener('click', (e)=>{
        SFX_ENABLED=!SFX_ENABLED; if(SFX_ENABLED) sfxInit();
        e.target.textContent='SFX: '+(SFX_ENABLED?'On':'Off');
      });
    }
    if(btnForce){ btnForce.addEventListener('click', ()=>ensureStart('force')); }
    if(btnRest){
      btnRest.addEventListener('click', ()=>{
        if(state.selectedWorker) startRest(state.selectedWorker);
        else log('Select a worker to rest.');
      });
    }
    const cv=document.getElementById('game'); if(cv){ cv.addEventListener('click', ()=>ensureStart('canvas')); }
    window.addEventListener('keydown', (e)=>{ if(e.key.toLowerCase()==='n') ensureStart('key'); });
    setTimeout(()=>{ if(!__started) ensureStart('auto'); }, 1200);
    const bootTimer=setInterval(()=>{ if(__started){ clearInterval(bootTimer); } else { ensureStart('retry'); } }, 800);
    const t=document.getElementById('ticker'); if(t) t.textContent='Ready — press New Game to start.';
  }catch(e){
    const t=document.getElementById('ticker');
    if(t) t.textContent='⚠️ initApp: '+(e&&e.message?e.message:String(e));
    showOverlay('Init Error', (e&&e.message?e.message:String(e)), 2400);
  }
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', initApp); } else { initApp(); }
</script>
